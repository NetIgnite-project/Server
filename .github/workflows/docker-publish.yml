name: Publish Docker Images

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version Format: x.y.z-[alpha|beta|pre].n'
        required: true
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: "false"
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version Format: x.y.z-[alpha|beta|pre].n'
        required: true
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: netignite-project/server

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      # A stable image moves `latest`, which self-hosted servers pull: only main may publish one.
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|pre)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use x.y.z or x.y.z-beta.n."
            exit 1
          fi
          if [[ "$PRE_RELEASE" != "true" && "$REF" != "refs/heads/main" ]]; then
            echo "::error::Only main can publish a stable image (tag 'latest'). Publish from $REF as a pre-release."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile
      
      - name: Build Nuxt application
        run: bun run build
      
      - name: Setup Docker
        id: docker-setup
        uses: ./.github/workflows/docker-setup
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Build and push Base Image
        uses: ./.github/workflows/docker-build-and-push
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.docker-setup.outputs.labels }}
          version: ${{ inputs.version }}
          pre_release: ${{ inputs.pre_release }}
