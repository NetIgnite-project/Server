<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0c1b" />
		<title>Offline · NetIgnite</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0b0c1b;
				color: #e2e8f0;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
				text-align: center;
				padding: 1.5rem;
				box-sizing: border-box;
			}
			main {
				max-width: 26rem;
			}
			svg {
				width: 3rem;
				height: 3rem;
			}
			h1 {
				font-size: 1.5rem;
				margin: 1rem 0 0.5rem;
				color: #fff;
			}
			p {
				color: #94a3b8;
				line-height: 1.5;
			}
			button {
				margin-top: 1rem;
				padding: 0.6rem 1.4rem;
				border: 0;
				border-radius: 0.5rem;
				background: #0087ff;
				color: #fff;
				font-size: 1rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<svg xmlns="http://www.w3.org/2000/svg" fill="#0087ff" viewBox="0 0 16 16" aria-hidden="true">
				<path
					d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z"
				/>
			</svg>
			<h1>You're offline</h1>
			<p>NetIgnite needs a connection to its server. Check your network and try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
